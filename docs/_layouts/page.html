---
layout: default
---
<link rel="stylesheet" href="{{ '/assets/css/docs.css' | relative_url }}">

<div class="doc-layout">
  <button class="doc-toc-toggle" id="doc-toc-toggle" type="button" aria-controls="doc-toc" aria-expanded="false">☰ On this page &amp; search</button>

  <nav class="doc-toc" id="doc-toc" aria-label="On this page">
    <div class="doc-search">
      <input type="search" id="doc-search-input" placeholder="Search the docs…" autocomplete="off" aria-label="Search the docs">
      <div class="doc-search-results" id="doc-search-results" hidden></div>
    </div>
    <div class="doc-toc-title">On this page</div>
    <ul class="doc-toc-list" id="doc-toc-list"></ul>
  </nav>

  <article class="doc-article">
    <header class="post-header">
      <h1 class="post-title">{{ page.title | escape }}</h1>
    </header>
    <div class="post-content" id="doc-content">
      {{ content }}
    </div>
  </article>
</div>

<script type="application/json" id="doc-search-index">{{ site.data.search_index | jsonify }}</script>
<script>window.DOC_BASEURL = {{ site.baseurl | jsonify }};</script>
<script src="{{ '/assets/js/docs.js' | relative_url }}"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: true, theme: 'neutral', securityLevel: 'loose' });
</script>
