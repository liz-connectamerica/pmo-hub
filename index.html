<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMO Hub</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<div class="auth-screen" id="auth-screen" style="display:none">
  <div class="auth-card">
    <div class="sidebar-logo" style="margin-bottom:24px"><i class="ti ti-layout-dashboard"></i> PMO Hub</div>
    <div class="form-group">
      <div class="form-label">Email</div>
      <input type="email" id="auth-email" placeholder="you@yourcompany.com">
    </div>
    <div class="form-group">
      <div class="form-label">Password</div>
      <div style="display:flex;gap:8px">
        <input type="password" id="auth-password" placeholder="••••••••">
        <button type="button" class="btn btn-sm" id="auth-password-toggle" title="Show/hide"><i class="ti ti-eye"></i></button>
      </div>
    </div>
    <div id="auth-error" class="auth-error" style="display:none"></div>
    <button class="btn btn-primary" id="auth-submit" style="width:100%;justify-content:center">
      <i class="ti ti-login"></i> Sign in
    </button>
  </div>
</div>

<div id="viewing-as-banner" style="display:none;position:sticky;top:0;z-index:9999;width:100%;background:#F5A623;color:#4A3200;padding:10px 20px;align-items:center;justify-content:center;gap:14px;font-weight:600;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,0.15)">
  <i class="ti ti-eye"></i> <span id="viewing-as-banner-text"></span>
  <button class="btn btn-sm" style="background:#4A3200;color:#fff;border:none" onclick="exitViewAs()"><i class="ti ti-x"></i> Exit</button>
</div>
<div class="app" id="app-root" style="display:none">
  <div class="sidebar">
    <div class="sidebar-logo"><i class="ti ti-layout-dashboard"></i> PMO Hub</div>
    <div id="nav-menu"></div>
    <div class="role-switcher">
      <div class="role-label">Signed in as</div>
      <div id="current-user-display" style="font-size:13px;font-weight:500;margin-bottom:4px"></div>
      <div id="preview-role-control" style="display:none;margin-bottom:8px">
        <div class="role-label">View as</div>
        <select class="role-select" id="preview-role-select" onchange="onViewAsSelectChange(this.value)">
          <option value="">My View</option>
        </select>
      </div>
      <a class="btn btn-sm" href="https://liz-connectamerica.github.io/pmo-hub/" target="_blank" rel="noopener" style="width:100%;justify-content:center;margin-bottom:6px">
        <i class="ti ti-help"></i> Help
      </a>
      <button class="btn btn-sm" id="change-password-btn" style="width:100%;justify-content:center;margin-bottom:6px">
        <i class="ti ti-key"></i> Change password
      </button>
      <button class="btn btn-sm" id="logout-btn" style="width:100%;justify-content:center">
        <i class="ti ti-logout"></i> Log out
      </button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>
<script src="lib/portfolio-health.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
